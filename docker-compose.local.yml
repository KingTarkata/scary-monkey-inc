# Serves the site straight from your cloned repo on the NAS. No build, no registry.
# Paste into a Portainer stack (Web editor). Set REPO_PATH to the ABSOLUTE path of the
# clone on the NAS (Portainer stacks can't resolve relative paths like ./site).
services:
  web:
    image: nginx:1.27-alpine
    container_name: scary-monkey-web
    restart: unless-stopped
    # Run as the owner of the site files (uid 1000 / gid 10 on the NAS) so NAS permissions/ACLs
    # allow reads. Non-root, so nginx needs writable scratch dirs, provided via tmpfs below.
    user: "1000:10"
    tmpfs:
      - /var/cache/nginx:uid=1000,gid=10
      - /run:uid=1000,gid=10
    ports:
      - "8080:80"
    volumes:
      - /volume1/docker/scary-monkey-inc/site:/usr/share/nginx/html:ro
      - /volume1/docker/scary-monkey-inc/nginx:/etc/nginx/conf.d:ro
